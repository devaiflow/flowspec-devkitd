[workspace]
resolver = "3"
members = [
    "crates/flowspec-domain",
    "crates/flowspec-app",
    "crates/flowspec-server",
]

[workspace.dependencies]
rmcp = { version = "3.1.2", features = [
    "transport-streamable-http-server",
    "client",
    "transport-streamable-http-client-reqwest",
] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.8"
figment = { version = "0.10", features = ["yaml", "env"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
indexmap = { version = "2", features = ["serde"] }
semver = "1"
insta = { version = "1", features = ["yaml"] }
anyhow = "1"
schemars = { version = "1.2", default-features = false, features = ["derive"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

flowspec-domain = { path = "crates/flowspec-domain" }
flowspec-app = { path = "crates/flowspec-app" }
